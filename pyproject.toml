[project]
name = "carina-editor"
version = "0.1.0"
description = "Automatischer Video-Editor für Carina Dorca (lokal im Browser)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "mediapipe>=0.10.14",
    "pillow>=10",
]

[project.optional-dependencies]
# Nvidia-Grafikkarte: CUDA-Bibliotheken für die Spracherkennung
gpu = [
    # 12.9.3 gibt es nicht für Windows, darum höchstens 12.9.2
    "nvidia-cublas-cu12>=12.4,<12.9.3; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
# Die App läuft auf Windows (Carinas PC). uv soll nur Versionen wählen, die es dort auch gibt.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
